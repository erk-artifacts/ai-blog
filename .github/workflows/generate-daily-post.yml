name: Generate Daily AI News Post

on:
  schedule:
    # 00:00 UTC = 09:00 JST
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: daily-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression tests
        run: npm test

      - name: Generate news post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
          REPO_DIR: ${{ github.workspace }}
        run: timeout 1440 node scripts/generate-post.mjs

      - name: Validate post
        run: node scripts/validate-post.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add daily AI news post for $(TZ=Asia/Tokyo date +%Y.%m.%d)"
            timeout 120 git push || { echo "git push timed out or failed"; exit 1; }
          fi

      - name: Preserve article and translation checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generation-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/generation/*.json
          if-no-files-found: ignore
          retention-days: 14
