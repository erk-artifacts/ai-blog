<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_GEEK // POST_GENERATOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['New Rocker', 'Noto Sans JP', 'cursive'],
                        body: ['Cossette Texte', 'Noto Sans JP', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'Noto Sans JP', 'monospace'],
                    },
                    colors: {
                        'night': '#0B1437', 'night-2': '#0F1A4B',
                        'gold': '#FDC800', 'azure': '#0250CC',
                        'parchment': '#FFE9CE', 'ink': '#1A1A1A', 'cream': '#F5E6C8',
                    },
                    borderRadius: { '2xl': '16px', '3xl': '24px' },
                    boxShadow: {
                        'card': '0 2px 8px rgba(0, 0, 0, 0.3)',
                        'gold-glow': '0 0 12px rgba(253, 200, 0, 0.4)',
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cossette+Texte:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&family=New+Rocker&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0B1437; background: radial-gradient(ellipse at top, #0F1A4B 0%, #0B1437 60%) fixed; color: #F5E6C8; font-family: 'IBM Plex Mono', 'Noto Sans JP', monospace; }
        input, textarea { background: #FFE9CE; border: 2px solid #1A1A1A; color: #1A1A1A; width: 100%; padding: 10px; margin-top: 5px; border-radius: 12px; font-family: 'Cossette Texte', 'Noto Sans JP', sans-serif; }
        input:focus, textarea:focus { border-color: #FDC800; box-shadow: 0 0 0 3px rgba(253, 200, 0, 0.3); outline: none; }
        .label { color: #F5E6C8; opacity: 0.7; font-size: 0.8rem; margin-top: 15px; display: block; }
        button { background: #FDC800; color: #1A1A1A; font-weight: bold; padding: 12px 24px; border: 3px solid #1A1A1A; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); cursor: pointer; margin-top: 20px; transition: transform 0.2s, box-shadow 0.2s; }
        button:hover { transform: translate(-2px, -2px); box-shadow: 0 0 12px rgba(253, 200, 0, 0.4); }
        #output { background: #0B1437; border: 2px solid #FDC800; color: #F5E6C8; padding: 20px; margin-top: 20px; white-space: pre-wrap; font-size: 0.9rem; border-radius: 12px; }
        /* キーボード操作のフォーカス可視化（アクセシビリティ: WCAG 2.2 AA） */
        a:focus-visible, button:focus-visible, input:focus-visible,
        textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #FDC800; outline-offset: 2px;
        }
        /* prefers-reduced-motion: 装飾アニメーションを抑制（WCAG 2.2 SC 2.3.3） */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body class="p-8 max-w-4xl mx-auto">

    <h1 class="text-2xl font-display font-bold mb-8 text-gold border-b-2 border-gold pb-4">>> POST_DATA_GENERATOR</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="label">TITLE</label>
            <input type="text" id="title" placeholder="記事のタイトル">

            <label class="label">CATEGORY</label>
            <input type="text" id="category" placeholder="AI NEWS, DEV LOG...">

            <label class="label">DATE (YYYY.MM.DD)</label>
            <input type="text" id="date" value="2026.">

            <label class="label">THUMBNAIL URL (Optional)</label>
            <input type="text" id="thumbnail" placeholder="https://...">
            <p class="text-xs text-cream/60 mt-1">※画像がない場合は空欄でOK</p>

            <label class="label">SUMMARY (一覧用)</label>
            <textarea id="summary" rows="3" placeholder="短い要約..."></textarea>
        </div>
        
        <div>
            <label class="label">BODY (HTML / Markdown 対応)</label>
            <textarea id="body" rows="12" placeholder="HTMLまたはMarkdownで入力&#10;例: ## 見出し&#10;**太字** _斜体_ [リンク](URL)"></textarea>
            <div class="text-xs text-cream/60 mt-2">
                HTML: &lt;p&gt;, &lt;h2&gt;, &lt;ul&gt;&lt;li&gt;, &lt;blockquote&gt;, &lt;figure&gt;, &lt;a&gt;<br>
                Markdown: ## 見出し, **太字**, _斜体_, [リンク](URL), - リスト, &gt; 引用
            </div>
        </div>
    </div>

    <button onclick="generateCode()">Generate Code</button>

    <div class="mt-8">
        <p class="text-sm text-cream/60 mb-2">/// COPY THIS CODE & PASTE INTO posts.js</p>
        <div id="output" role="button" tabindex="0" aria-label="生成コードをクリップボードにコピー" onclick="copyToClipboard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();copyToClipboard()}">（ここに生成されたコードが表示されます）</div>
        <p id="copy-msg" aria-live="polite" class="text-gold text-xs mt-2 hidden">COPIED TO CLIPBOARD!</p>
    </div>

    <script>
        // 今日の日付をセット
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = `${y}.${m}.${d}`;

        function generateCode() {
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const thumbnail = document.getElementById('thumbnail').value; // サムネイル取得
            const summary = document.getElementById('summary').value;
            let body = document.getElementById('body').value;

            // 改行をHTML上で見やすくインデントするための処理（簡易）
            // バックティック文字だけエスケープ
            body = body.replace(/`/g, "\\`");

            const code = `{
        title: "${title}",
        category: "${category}",
        date: "${date}",
        thumbnail: "${thumbnail}",
        summary: "${summary}",
        body: \`
${body}
        \`
    },`;

            document.getElementById('output').innerText = code;
        }

        function copyToClipboard() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const msg = document.getElementById('copy-msg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 2000);
            });
        }
    </script>
</body>
</html>
