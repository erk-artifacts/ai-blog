<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Anton&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #131318;
    font-family: 'Noto Sans JP', sans-serif;
    color: #ECEAF2;
    padding: 48px;
  }
  h1 {
    font-family: 'IBM Plex Mono', 'Noto Sans JP', monospace;
    font-size: 15px; font-weight: 500; letter-spacing: .12em;
    color: #A8A6B5; margin-bottom: 8px;
  }
  .sub { font-size: 13px; color: #7c7a8a; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
  .cell {
    background: #20202A; border: 1px solid rgba(255,255,255,.10);
    border-radius: 4px; overflow: hidden;
  }
  .cell-label {
    font-family: 'IBM Plex Mono', 'Noto Sans JP', monospace;
    font-size: 13px; font-weight: 600; letter-spacing: .06em;
    padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .cell-label small { font-weight: 400; color: #A8A6B5; font-size: 11px; }
  .mini { padding: 0 16px 16px; }
  .hero {
    border-radius: 2px; padding: 18px 18px 16px; margin-bottom: 10px;
  }
  .hero .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .1em;
    margin-bottom: 8px; opacity: .75;
  }
  .hero .hl {
    font-weight: 900; font-size: 19px; line-height: 1.3;
    font-feature-settings: "palt";
  }
  .row2 { display: flex; gap: 10px; }
  .tile {
    flex: 1; border-radius: 2px; padding: 12px 14px;
  }
  .tile .t { font-weight: 900; font-size: 12.5px; line-height: 1.35; font-feature-settings: "palt"; }
  .tile .d { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: .08em; margin-bottom: 5px; opacity: .75; }
  .meta {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
  }
  .ts { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .06em; }
  .title-line { font-size: 11px; font-weight: 700; color: #ECEAF2; }
  .tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: .08em;
    padding: 2px 8px; border-radius: 999px; color: #20202A; font-weight: 600;
  }
</style>
<body>
  <h1>AI_GEEK — PASTEL PALETTE BOARD</h1>
  <div class="sub">案B（ダーク×パステル）の配色候補6パターン。各パターン：ヒーロー色面 / 特集タイル / タイムスタンプ / タグ の色の割り当てを表示。地色はすべて #20202A。</div>
  <div class="grid" id="grid"></div>
<script>
const schemes = [
  { no: '01', name: '寒色（現行b2）', hero: '#C3B8F0', tile: '#A8E6CF', ts: '#A8E6CF', tag: '#F2BFD4' },
  { no: '02', name: '暖色（現行b3）', hero: '#F6CDA9', tile: '#B9D8F0', ts: '#B9D8F0', tag: '#F2E0A8' },
  { no: '03', name: 'サクラ×ラベンダー', hero: '#F2C6D8', tile: '#C8BEF2', ts: '#F2C6D8', tag: '#B5E8D2' },
  { no: '04', name: 'ミント×ラベンダー', hero: '#B2E6CE', tile: '#C8BEF2', ts: '#B2E6CE', tag: '#F6CDA9' },
  { no: '05', name: 'スカイ×サクラ', hero: '#B9D8F0', tile: '#F2C6D8', ts: '#B9D8F0', tag: '#B5E8D2' },
  { no: '06', name: 'ラベンダー単色（静か）', hero: '#C3B8F0', tile: '#2A2A35', ts: '#C3B8F0', tag: '#C3B8F0', tileText: '#ECEAF2' },
];
const grid = document.getElementById('grid');
for (const s of schemes) {
  const ink = '#20202A';
  const tileText = s.tileText || ink;
  grid.insertAdjacentHTML('beforeend', `
  <div class="cell">
    <div class="cell-label"><span>${s.no} ${s.name}</span><small>${s.hero}</small></div>
    <div class="mini">
      <div class="hero" style="background:${s.hero};color:${ink}">
        <div class="eyebrow">TODAY / 2026.08.15 FRI</div>
        <div class="hl">今日のAI最前線：AIを巡る法廷騒動から巨頭の戦略まで</div>
      </div>
      <div class="row2">
        <div class="tile" style="background:${s.tile};color:${tileText}">
          <div class="d">AI NEWS / 08.14</div>
          <div class="t">AnthropicがAIエージェントの"縄張り争い"を警告！</div>
        </div>
        <div class="tile" style="background:#2A2A35;color:#ECEAF2">
          <div class="d" style="color:${s.ts};opacity:1">08.13 09:00</div>
          <div class="t" style="font-weight:700">Grok 4.6登場！AIの進化と新たな挑戦</div>
        </div>
      </div>
      <div class="meta">
        <span class="ts" style="color:${s.ts}">08.12 09:00</span>
        <span class="title-line">GeminiとChatGPTが10億ユーザー突破</span>
        <span class="tag" style="background:${s.tag}">DEEP DIVE</span>
      </div>
    </div>
  </div>`);
}
</script>
</body>
</html>
