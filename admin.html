<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_GEEK // POST_GENERATOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Anton', 'Noto Sans JP', 'sans-serif'],
                        body: ['Noto Sans JP', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'Noto Sans JP', 'monospace'],
                    },
                    colors: {
                        'canvas': '#20202A',
                        'surface': '#2A2A35',
                        'surface-2': '#33333F',
                        'paper': '#ECEAF2',
                        'muted': '#A8A6B5',
                        'faint': '#7C7A8A',
                        'sakura': '#F2C6D8',
                        'lavender': '#C8BEF2',
                        'mint': '#B5E8D2',
                        'ink': '#20202A',
                        'hair': 'rgba(255,255,255,.10)',
                        'hair-2': 'rgba(255,255,255,.18)',
                    },
                    borderRadius: { DEFAULT: '4px', 'md': '4px', 'lg': '4px', 'xl': '4px', '2xl': '4px', '3xl': '4px' },
                    boxShadow: { 'card': 'none' },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #20202A;
            --bg-2:     #2A2A35;
            --bg-3:     #33333F;
            --paper:    #ECEAF2;
            --muted:    #A8A6B5;
            --faint:    #7C7A8A;
            --sakura:   #F2C6D8;
            --lavender: #C8BEF2;
            --mint:     #B5E8D2;
            --ink:      #20202A;
            --hair:     rgba(255,255,255,.10);
            --hair-2:   rgba(255,255,255,.18);
            --mono: 'IBM Plex Mono', 'Noto Sans JP', monospace;
            --jp: 'Noto Sans JP', sans-serif;
            --display: 'Anton', 'Noto Sans JP', sans-serif;
        }
        html { background: var(--bg); }
        body {
            background: var(--bg);
            color: var(--paper);
            font-family: var(--jp);
            font-weight: 500;          /* 暗背景の日本語は 500 以上で可読性を確保 */
            line-height: 1.9;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 見出し --- */
        .page-title {
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(24px, 5.2vw, 38px);
            letter-spacing: 0.01em;
            color: var(--sakura);
            text-transform: uppercase;
            line-height: 1.1;
        }
        .eyebrow {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        /* --- フォーム --- */
        .label {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-top: 22px;
            margin-bottom: 6px;
            display: block;
        }
        input, textarea {
            background: var(--bg-2);
            border: 1px solid var(--hair);
            color: var(--paper);
            width: 100%;
            padding: 10px 12px;
            margin-top: 0;
            border-radius: 4px;
            font-family: var(--jp);
            font-weight: 500;
            font-size: 14px;
            line-height: 1.7;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        textarea { resize: vertical; }
        /* 日付・URL などラテン系メタデータは等幅で */
        #date, #thumbnail { font-family: var(--mono); font-weight: 400; letter-spacing: 0.02em; }
        /* プレースホルダは情報を伝えるため --faint(3.3:1) ではなく --muted(5.8:1) を使う */
        input::placeholder, textarea::placeholder { color: var(--muted); font-weight: 500; opacity: 1; }
        input:hover, textarea:hover { border-color: var(--hair-2); }
        input:focus, textarea:focus {
            border-color: var(--lavender);
            box-shadow: 0 0 0 3px rgba(200, 190, 242, 0.25);
            outline: none;
        }

        /* --- ボタン --- */
        button {
            background: var(--lavender);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            line-height: 1;
            padding: 14px 28px;
            border: none;
            border-radius: 999px;   /* 押せるものは pill（サイト側のボタンと統一） */
            cursor: pointer;
            margin-top: 28px;
            transition: background-color 0.15s;
        }
        button:hover { background: #D6CEF6; }
        button:active { background: #BDB2EE; }

        /* --- 出力パネル --- */
        #output {
            background: var(--bg-2);
            border: 1px solid var(--hair);
            color: var(--paper);
            padding: 20px;
            margin-top: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;   /* JP を含むため 500（ダーク地の可読性） */
            line-height: 1.7;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }
        #output:hover { border-color: var(--hair-2); background: var(--bg-3); }

        /* 右カラムは左カラムと同じ高さまで BODY を伸ばして揃える */
        .col-fill { display: flex; flex-direction: column; }
        .col-fill #body { flex: 1 1 auto; min-height: 320px; }

        .hint {
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.7;
            color: var(--muted);
            letter-spacing: 0.02em;
        }
        .hint-jp { font-family: var(--jp); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }

        /* キーボード操作のフォーカス可視化（アクセシビリティ: WCAG 2.2 AA） */
        a:focus-visible, button:focus-visible, input:focus-visible,
        textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #C8BEF2; outline-offset: 2px;
        }
        /* prefers-reduced-motion: 装飾アニメーションを抑制（WCAG 2.2 SC 2.3.3） */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body class="p-8 max-w-4xl mx-auto">

    <header class="mb-8 pb-4 border-b border-hair">
        <p class="eyebrow mb-2">AI_GEEK &middot; INTERNAL TOOL</p>
        <h1 class="page-title">>> POST_DATA_GENERATOR</h1>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-8">
        <div>
            <p class="eyebrow">01 / META</p>

            <label class="label">TITLE</label>
            <input type="text" id="title" placeholder="記事のタイトル">

            <label class="label">CATEGORY</label>
            <input type="text" id="category" placeholder="AI NEWS, DEV LOG...">

            <label class="label">DATE (YYYY.MM.DD)</label>
            <input type="text" id="date" value="2026.">

            <label class="label">THUMBNAIL URL (Optional)</label>
            <input type="text" id="thumbnail" placeholder="https://...">
            <p class="hint-jp mt-2">※画像がない場合は空欄でOK</p>

            <label class="label">SUMMARY (一覧用)</label>
            <textarea id="summary" rows="3" placeholder="短い要約..."></textarea>
        </div>

        <div class="col-fill">
            <p class="eyebrow">02 / CONTENT</p>

            <label class="label">BODY (HTML / Markdown 対応)</label>
            <textarea id="body" rows="12" placeholder="HTMLまたはMarkdownで入力&#10;例: ## 見出し&#10;**太字** _斜体_ [リンク](URL)"></textarea>
            <div class="hint mt-3">
                HTML: &lt;p&gt;, &lt;h2&gt;, &lt;ul&gt;&lt;li&gt;, &lt;blockquote&gt;, &lt;figure&gt;, &lt;a&gt;<br>
                <span class="hint-jp">Markdown: ## 見出し, **太字**, _斜体_, [リンク](URL), - リスト, &gt; 引用</span>
            </div>
        </div>
    </div>

    <button onclick="generateCode()">Generate Code</button>

    <div class="mt-10 pt-6 border-t border-hair">
        <p class="eyebrow mb-2">/// COPY THIS CODE &amp; PASTE INTO posts.js</p>
        <div id="output" role="button" tabindex="0" aria-label="生成コードをクリップボードにコピー" onclick="copyToClipboard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();copyToClipboard()}">（ここに生成されたコードが表示されます）</div>
        <p id="copy-msg" aria-live="polite" class="eyebrow mt-3 hidden" style="color:#B5E8D2">COPIED TO CLIPBOARD!</p>
    </div>

    <script>
        // 今日の日付をセット
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = `${y}.${m}.${d}`;

        function generateCode() {
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const thumbnail = document.getElementById('thumbnail').value; // サムネイル取得
            const summary = document.getElementById('summary').value;
            let body = document.getElementById('body').value;

            // 改行をHTML上で見やすくインデントするための処理（簡易）
            // バックティック文字だけエスケープ
            body = body.replace(/`/g, "\\`");

            const code = `{
        title: "${title}",
        category: "${category}",
        date: "${date}",
        thumbnail: "${thumbnail}",
        summary: "${summary}",
        body: \`
${body}
        \`
    },`;

            document.getElementById('output').innerText = code;
        }

        function copyToClipboard() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const msg = document.getElementById('copy-msg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 2000);
            });
        }
    </script>
</body>
</html>
